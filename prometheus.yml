global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fastapi
    metrics_path: /metrics           # exposed by Instrumentator().expose(app)
    static_configs:
      - targets: ["api:8000"]        # service name from docker-compose.yml
        labels:
          service: prediction-api